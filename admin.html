<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin — Silverhawk Audio Mixer</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/gallery.css">
</head>
<body>
  <main class="app">
    <div class="panel auth-box">
      <h1>Admin</h1>
      <p>Login diverifikasi di Edge Function. Email/password admin disimpan sebagai <strong>Supabase secrets</strong>, bukan di repo.</p>
      <div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div>
      <div class="field"><label>Password</label><input id="pass" type="password" autocomplete="current-password"></div>
      <button type="button" class="btn btn-primary" id="btn" style="width:100%">Masuk admin</button>
      <p style="font-size:12px;color:var(--muted);margin-top:12px">Default setup secrets: ADMIN_EMAIL=admin@silverhawk.web.id · ADMIN_PASSWORD (hanya di Supabase secrets)</p>
    </div>
  </main>
  <div class="toast"></div>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script>
    MixerUI.initTheme();
    document.getElementById("btn").onclick = async function () {
      try {
        var r = await MixerAuth.adminLogin(
          document.getElementById("email").value,
          document.getElementById("pass").value
        );
        sessionStorage.setItem("sh_admin", r.token || "1");
        MixerUI.toast("Admin OK");
      } catch (e) {
        MixerUI.toast(e.message || String(e));
      }
    };
  </script>
</body>
</html>
