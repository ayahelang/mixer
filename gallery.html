<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Galeri Showcase — Silverhawk Audio Mixer</title>
  <meta name="description" content="Galeri rekaman dan mix publik Silverhawk Audio Mixer. Putar, like, dan komentar.">
  <meta name="theme-color" content="#0b6cf0">
  <link rel="canonical" href="https://mixer.silverhawk.web.id/gallery.html">
  <meta property="og:title" content="Galeri — Silverhawk Audio Mixer">
  <meta property="og:image" content="https://mixer.silverhawk.web.id/assets/og-image.svg">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/gallery.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <a class="brand" href="index.html" style="text-decoration:none;color:inherit">
        <div class="logo">🎛</div>
        <div><strong>Galeri Showcase</strong><span>Silverhawk Audio Mixer</span></div>
      </a>
      <nav class="nav">
        <a href="index.html">Beranda</a>
        <a href="studio.html">Studio</a>
        <span id="authSlot"></span>
        <button type="button" class="icon-btn" id="themeBtn" aria-label="Tema">☾</button>
      </nav>
    </header>
    <div class="section-head">
      <div>
        <h2>Semua karya publik</h2>
        <p>Urut terbaru · klik Buka untuk detail, like & komentar</p>
      </div>
    </div>
    <div class="grid-cards" id="galleryGrid"></div>
    <footer class="footer"><span>© Silverhawk</span></footer>
  </main>
  <div class="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/gallery.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async function () {
      MixerUI.initTheme();
      document.getElementById("themeBtn").onclick = MixerUI.toggleTheme;
      await MixerUI.renderAuthSlot();
      MixerGallery.renderGrid("#galleryGrid", 48);
    });
  </script>
</body>
</html>
